[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "open-licenseplate"
version = "0.1.0"
description = "Local-first license plate detection application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "open-licenseplate contributors" }]
dependencies = [
    "fastapi>=0.115,<1",
    "platformdirs>=4.3,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[project.scripts]
open-licenseplate = "open_licenseplate.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/open_licenseplate"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that exercise application boundaries",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
exclude = "^tests/"
